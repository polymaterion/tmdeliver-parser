# Список чатов (20–25): публичные — по `username`, приватные — по числовому `id`.
# Аккаунт юзербота должен уже состоять в этих чатах (автоматически он никуда не вступает).
# Числовой id приватного группового чата имеет вид -100XXXXXXXXXX (узнать: @userinfobot / @getidsbot,
# либо из ссылки t.me/c/XXXXXXXXXX/N → id = -100XXXXXXXXXX). Инвайт-ссылки (t.me/+…) не поддерживаются.
# Чаты можно также добавлять/отключать командами бота (/sources, /add_source).
defaults:
  notify_threshold: 50        # порог уведомления (0–100), потом меняется в боте
  max_sources: 25
  backfill_hours: 0           # при первом запуске догружать N часов истории (0 = только новое)
  notify_window_minutes: 720  # не уведомлять о находках старше N минут (защита от «залпа» после простоя)
  default_language: ru        # ru | tk (любой файл из locales/)

sources:
  - username: example_chat_one
    title: Пример: чат 1
  - username: example_chat_two
    title: Пример: чат 2
  # Приватный чат (аккаунт уже в нём состоит):
  # - id: -1001234567890
  #   title: Приватная группа
