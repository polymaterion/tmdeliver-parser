# Список чатов (20–25). Публичные — по `username`, приватные — по числовому `id`.
# Аккаунт юзербота должен уже состоять в этих чатах (автоматически он никуда не вступает).
# ВАЖНО: если в title есть двоеточие, заключайте значение в кавычки: title: "Чат: пример".
defaults:
  notify_threshold: 50        # порог уведомления (0–100), потом меняется в боте
  max_sources: 25
  backfill_hours: 0           # при первом запуске догружать N часов истории (0 = только новое)
  notify_window_minutes: 720  # не уведомлять о находках старше N минут
  default_language: ru        # ru | tk (любой файл из locales/)

sources:
  - username: russia_turkmens
    title: "Туркмены в России"
  - username: talypby
    title: "Minsk Turkmen Talyplar"
  - username: cargoRFTM
    title: "Карго логистика Turkmenistan"
  - username: polsadayasayanturkmenler
    title: "Polşada ýaşaýan türkmenler"
  - username: talyplar_biznes
    title: "Talyplar Biznes"
  - username: tkm_hemayat_2024
    title: "Turkmenlere hemaýat"
  - username: amerikadakyturkmenler
    title: "Amerikadaky Türkmenler"
  - username: rossiya_turkmenler
    title: "Rossiýadaky Turkmenler"
  - username: kazan_turkmen
    title: "Kazan"
  - username: Lebaplylar
    title: "Лебапские"
  - username: turkmenlere_komek
    title: "Türkmenlere kömek"

